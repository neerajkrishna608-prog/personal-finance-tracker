<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense | FinanceTracker</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        /* ================= LAYOUT ================= */

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            width: 250px;
            background: #131c31;
            padding: 30px 22px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            border-right: 1px solid rgba(255,255,255,.05);

            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .logo {
            margin-bottom: 45px;
        }

        .logo h2 {
            font-size: 26px;
            font-weight: 700;
            color: white;
        }

        .logo span {
            color: #3b82f6;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar nav a {
            text-decoration: none;
            color: #cbd5e1;

            padding: 16px 18px;

            border-radius: 14px;

            transition: .3s;

            font-size: 16px;
        }

        .sidebar nav a:hover {
            background: #2563eb;
            color: white;
            transform: translateX(6px);
        }

        .sidebar nav .active {
            background: #2563eb;
            color: white;
            box-shadow: 0 15px 35px rgba(37,99,235,.35);
        }

        /* ================= LOGOUT ================= */

        .logout {
            margin-top: auto;
        }

        .logout a {
            display: block;
            text-align: center;

            background: #ef4444;
            color: white;

            text-decoration: none;

            padding: 14px;

            border-radius: 10px;

            font-weight: bold;

            transition: .25s;
        }

        .logout a:hover {
            background: #dc2626;
        }

        /* ================= MAIN CONTENT ================= */

        .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);

            padding: 55px 45px;
        }

        /* ================= HEADER ================= */

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-header h1 span {
            color: #ef4444;
        }

        .page-header p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* ================= CARD ================= */

        .expense-card {
            background: #1e293b;

            border-radius: 20px;

            padding: 35px;

            border: 1px solid rgba(255,255,255,.06);

            box-shadow: 0 15px 35px rgba(0,0,0,.25);

            width: 100%;
            max-width: 700px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: bold;

            color: #e2e8f0;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            background: #0f172a;

            color: #f8fafc;

            border: 1px solid #334155;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: .25s;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #ef4444;

            box-shadow: 0 0 0 3px rgba(239,68,68,.12);
        }

        /* ================= BUTTON ================= */

        .save-button {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            background: #ef4444;

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: .25s;
        }

        .save-button:hover {
            background: #dc2626;

            transform: translateY(-1px);
        }

        /* ================= BACK BUTTON ================= */

        .back-link {
            display: inline-block;

            margin-top: 25px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 14px;

            transition: .25s;
        }

        .back-link:hover {
            color: #ef4444;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .layout {
                display: block;
            }

            .sidebar {
                position: relative;

                width: 100%;

                height: auto;

                padding: 20px;
            }

            .logo {
                padding-bottom: 20px;
            }

            .sidebar nav {
                flex-direction: row;

                flex-wrap: wrap;
            }

            .sidebar nav a {
                padding: 10px 12px;
            }

            .logout {
                margin-top: 20px;
            }

            .main-content {
                margin-left: 0;

                width: 100%;

                padding: 30px 20px;
            }

            .page-header h1 {
                font-size: 27px;
            }

            .expense-card {
                padding: 25px;
            }

        }

    </style>

</head>

<body>

<div class="layout">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div>

            <div class="logo">

                <h2>
                    Finance<span>Tracker</span>
                </h2>

            </div>

            <nav>

                <a href="/dashboard">
                    🏠 Dashboard
                </a>

                <a href="/income">
                    💰 Income
                </a>

                <a href="/expense" class="active">
                    💸 Expense
                </a>

                <a href="/transactions">
                    📋 Transactions
                </a>

                <a href="/reports">
                    📊 Reports
                </a>

                <a href="/settings">
                    ⚙ Settings
                </a>

            </nav>

        </div>

        <div class="logout">

            <a href="/logout">
                🚪 Logout
            </a>

        </div>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <!-- Header -->

        <div class="page-header">

            <h1>

                <span th:text="${expense != null ? 'Edit Expense' : 'Add Expense'}">
                    Add Expense
                </span>

                💸

            </h1>

            <p>
                Add a new expense or update an existing one.
            </p>

        </div>


        <!-- Expense Form -->

        <div class="expense-card">

            <form th:action="@{/expense/save}" method="post">

                <!-- Hidden ID for Editing -->

                <input
                        type="hidden"
                        name="id"
                        th:value="${expense != null ? expense.id : ''}">


                <!-- Category -->

                <div class="form-group">

                    <label for="category">
                        Expense Category
                    </label>

                    <input
                            type="text"
                            id="category"
                            name="category"
                            th:value="${expense != null ? expense.category : ''}"
                            placeholder="Food, Shopping, Bills..."
                            required>

                </div>


                <!-- Amount -->

                <div class="form-group">

                    <label for="amount">
                        Amount (₹)
                    </label>

                    <input
                            type="number"
                            id="amount"
                            name="amount"
                            step="0.01"
                            min="0"
                            th:value="${expense != null ? expense.amount : ''}"
                            placeholder="Enter amount"
                            required>

                </div>


                <!-- Date -->

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                            type="date"
                            id="date"
                            name="date"
                            th:value="${expense != null ? #temporals.format(expense.date,'yyyy-MM-dd') : ''}"
                            required>

                </div>


                <!-- Save / Update -->

                <button
                        type="submit"
                        class="save-button">

                    💸

                    <span th:text="${expense != null ? 'Update Expense' : 'Save Expense'}">
                        Save Expense
                    </span>

                </button>

            </form>


            <!-- Back -->

            <a
                    href="/dashboard"
                    class="back-link">

                ← Back to Dashboard

            </a>

        </div>

                <!-- Expense History -->

        <div class="expense-card" style="margin-top:30px;">

            <h2 style="margin-bottom:20px;">
                📋 Expense History
            </h2>

            <table style="width:100%; border-collapse:collapse;">

                <thead>

                <tr>
                    <th style="text-align:left; padding:12px;">Date</th>
                    <th style="text-align:left; padding:12px;">Category</th>
                    <th style="text-align:left; padding:12px;">Amount</th>
                    <th style="text-align:left; padding:12px;">Action</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="expenseItem : ${expenses}">

                    <td style="padding:12px;">
                        <span th:text="${expenseItem.date}"></span>
                    </td>

                    <td style="padding:12px;">
                        <span th:text="${expenseItem.category}"></span>
                    </td>

                    <td style="padding:12px; color:#ef4444; font-weight:bold;">
                        ₹<span th:text="${expenseItem.amount}"></span>
                    </td>

                    <td style="padding:12px;">

                        <a
                                th:href="@{/expense/edit/{id}(id=${expenseItem.id})}"
                                class="edit-btn"
                                style="margin-right:6px;">
                            Edit
                        </a>

                        <a
                                th:href="@{/expense/delete/{id}(id=${expenseItem.id})}"
                                class="delete-btn"
                                onclick="return confirm('Are you sure you want to delete this expense?');">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>
    </main>

</div>

</body>

</html>
