<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        nav {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            background: crimson;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #1e293b;
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .card {
            flex: 1;
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 15px;
            color: #555;
        }

        .card h2 {
            color: #2563eb;
        }

        .buttons {
            text-align: center;
            margin-bottom: 40px;
        }

        .buttons button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .income {
            background: green;
        }

        .expense {
            background: crimson;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,.1);
        }

        table th,
        table td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        table th {
            background: #2563eb;
            color: white;
        }
    </style>

</head>

<body>

<nav>
    <h2>Personal Finance Tracker</h2>

    <a href="/">Logout</a>
</nav>

<div class="container">

    <h1>Welcome to your Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h3>Total Income</h3>
            <h2 th:text="${totalIncome}">0</h2>
        </div>

        <div class="card">
            <h3>Total Expense</h3>
            <h2>₹<span th:text="${totalExpense}">0</span></h2>
        </div>

        <div class="card">
            <h3>Balance</h3>
            <h2>₹<span th:text="${balance}">0</span></h2>
        </div>

    </div>

    <div class="buttons">

        <a href="/income">
            <button class="income">
                Add Income
            </button>
        </a>

        <a href="/expense">
            <button class="expense">
                Add Expense
            </button>
        </a>

    </div>

    <table>

        <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Action</th>
        </tr>

        <tr th:each="transaction : ${transactions}">

            <td th:text="${transaction.date}"></td>

            <td th:text="${transaction.category}"></td>

            <td>
                ₹<span th:text="${transaction.amount}"></span>
            </td>

            <td>
                <span th:if="${transaction.type == 'Income'}"
                      style="color:green;font-weight:bold;">
                    Income
                </span>

                <span th:if="${transaction.type == 'Expense'}"
                      style="color:crimson;font-weight:bold;">
                    Expense
                </span>
            </td>

            <td>

                <!-- Income Buttons -->
                <!-- Income Buttons -->
<a th:if="${transaction.type == 'Income'}"
   th:href="@{/income/edit/{id}(id=${transaction.id})}"
   style="background:orange;color:white;padding:6px 12px;text-decoration:none;border-radius:5px;margin-right:5px;">
    Edit
</a>

<a th:if="${transaction.type == 'Income'}"
   th:href="@{/income/delete/{id}(id=${transaction.id})}"
   onclick="return confirm('Are you sure you want to delete this income?');"
   style="background:red;color:white;padding:6px 12px;text-decoration:none;border-radius:5px;">
    Delete
</a>

<!-- Expense Buttons -->
<a th:if="${transaction.type == 'Expense'}"
   th:href="@{/expense/edit/{id}(id=${transaction.id})}"
   style="background:orange;color:white;padding:6px 12px;text-decoration:none;border-radius:5px;margin-right:5px;">
    Edit
</a>

<a th:if="${transaction.type == 'Expense'}"
   th:href="@{/expense/delete/{id}(id=${transaction.id})}"
   onclick="return confirm('Are you sure you want to delete this expense?');"
   style="background:red;color:white;padding:6px 12px;text-decoration:none;border-radius:5px;">
    Delete
</a>`

            </td>

        </tr>

    </table>

</div>

</body>

</html>
