<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | FinanceTracker</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                    135deg,
                    #0f172a,
                    #172554,
                    #1e3a8a
            );

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;

            background: linear-gradient(
                    145deg,
                    #1e3a8a,
                    #172554,
                    #0f172a
            );

            padding: 42px;

            border-radius: 22px;

            border: 1px solid rgba(96, 165, 250, 0.35);

            box-shadow:
                    0 25px 60px rgba(0, 0, 0, 0.45),
                    0 0 30px rgba(37, 99, 235, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            margin-bottom: 30px;
        }

        .logo span {
            color: #3b82f6;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .description {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;

            border-radius: 10px;

            border: 1px solid #3b5f9f;

            background: rgba(15, 23, 42, 0.55);

            color: white;

            margin-bottom: 20px;

            font-size: 15px;

            outline: none;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: #3b82f6;

            box-shadow:
                    0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {

            background: linear-gradient(
                    135deg,
                    #1d4ed8,
                    #2563eb
            );

            transform: translateY(-2px);

            box-shadow:
                    0 10px 25px rgba(37, 99, 235, 0.35);
        }

        .error {

            background: rgba(220, 38, 38, 0.2);

            color: #fca5a5;

            border: 1px solid rgba(248, 113, 113, 0.4);

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #60a5fa;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        Finance<span>Tracker</span>
    </div>

    <h1>Reset Password 🔐</h1>

    <p class="description">
        Create a new password for your account.
    </p>

    <p
            class="error"
            th:if="${error}"
            th:text="${error}">
    </p>

    <form action="/reset-password" method="post">

        <input
                type="hidden"
                name="token"
                th:value="${token}">

        <label>New Password</label>

        <input
                type="password"
                name="newPassword"
                placeholder="Enter your new password"
                required>

        <label>Confirm New Password</label>

        <input
                type="password"
                name="confirmPassword"
                placeholder="Confirm your new password"
                required>

        <button type="submit">
            Reset Password
        </button>

    </form>

    <a href="/login" class="back">
        ← Back to Login
    </a>

</div>

</body>

</html>
