<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | FinanceTracker</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.18), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.12), transparent 30%),
                #0f172a;

            color: #f8fafc;
        }

        /* ================= BACKGROUND ================= */

        .background-glow {
            position: fixed;

            width: 350px;
            height: 350px;

            background: rgba(37, 99, 235, 0.12);

            border-radius: 50%;

            filter: blur(100px);

            top: -100px;
            left: -100px;

            pointer-events: none;
        }

        /* ================= CARD ================= */

        .container {
            width: 420px;

            background: rgba(30, 41, 59, 0.95);

            padding: 45px;

            border-radius: 22px;

            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45),
                0 0 40px rgba(37, 99, 235, 0.08);

            position: relative;

            overflow: hidden;
        }

        .container::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 4px;

            background: #2563eb;
        }

        /* ================= LOGO ================= */

        .logo {
            text-align: center;

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 8px;

            color: white;
        }

        .logo span {
            color: #3b82f6;
        }

        .subtitle {
            text-align: center;

            color: #94a3b8;

            font-size: 14px;

            margin-bottom: 30px;
        }

        /* ================= TITLE ================= */

        h1 {
            text-align: center;

            font-size: 29px;

            margin-bottom: 10px;

            color: #f8fafc;
        }

        .description {
            text-align: center;

            color: #94a3b8;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 17px;

            opacity: 0.8;
        }

        input {
            width: 100%;

            padding: 14px 15px 14px 45px;

            background: #0f172a;

            color: #f8fafc;

            border: 1px solid #334155;

            border-radius: 11px;

            outline: none;

            font-size: 15px;

            transition: 0.25s;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.12);

            background: #111c31;
        }

        /* ================= BUTTON ================= */

        button {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 11px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

            transition: 0.25s;

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.25);
        }

        button:hover {
            background: #3b82f6;

            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(37, 99, 235, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        /* ================= MESSAGES ================= */

        .error {
            color: #f87171;

            text-align: center;

            margin-top: 15px;

            font-size: 14px;
        }

        .success {
            color: #4ade80;

            text-align: center;

            margin-top: 15px;

            font-size: 14px;
        }

        /* ================= LINK ================= */

        .login-link {
            display: block;

            text-align: center;

            margin-top: 25px;

            color: #60a5fa;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }

        .login-link:hover {
            color: #93c5fd;
        }

        /* ================= HOME LINK ================= */

        .home-link {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }

        .home-link:hover {
            color: white;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 500px) {

            body {
                padding: 20px;
            }

            .container {
                width: 100%;

                padding: 35px 25px;
            }

            h1 {
                font-size: 26px;
            }
        }

    </style>

</head>

<body>

<div class="background-glow"></div>

<div class="container">

    <!-- Logo -->

    <div class="logo">
        Finance<span>Tracker</span>
    </div>

    <p class="subtitle">
        Account recovery
    </p>


    <!-- Title -->

    <h1>
        Forgot Password? 🔐
    </h1>

    <p class="description">
        Enter your registered email address to continue.
    </p>


    <!-- Form -->

    <form action="/forgot-password" method="post">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <div class="input-wrapper">

                <span class="input-icon">📧</span>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

            </div>

        </div>


        <!-- Continue -->

        <button type="submit">
            Continue
        </button>

    </form>


    <!-- Error -->

    <p
            class="error"
            th:text="${error}">
    </p>


    <!-- Success -->

    <p
            class="success"
            th:text="${success}">
    </p>


    <!-- Login -->

    <a
            href="/login"
            class="login-link">

        ← Back to Login

    </a>


    <!-- Home -->

    <a
            href="/"
            class="home-link">

        Back to Home

    </a>

</div>

</body>

</html>
